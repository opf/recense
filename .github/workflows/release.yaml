name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./... && go vet ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          scripts/package.sh "$VERSION" amd64
          scripts/package.sh "$VERSION" arm64
          cp install.sh dist/install.sh
          cd dist
          sha256sum recense_*.tar.gz install.sh > checksums.txt
      - uses: azure/setup-helm@v4.3.0
      - run: helm lint charts/recense && helm package charts/recense --destination dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --verify-tag --title "Recense $VERSION" --generate-notes
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image version
        env:
          VERSION: ${{ github.ref_name }}
        run: echo "IMAGE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/opf/recense:${{ env.IMAGE_VERSION }}
          build-args: VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/opf/recense
          cache-from: type=gha
          cache-to: type=gha,mode=max
