apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: recense
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recense
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: recense
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --root=/host
            - --runtime={{ .Values.runtime }}
            - --socket=/runtime/runtime.sock
            - --containerd-namespace={{ .Values.containerdNamespace }}
            - --interval={{ .Values.interval }}
            - --scan-timeout={{ .Values.scanTimeout }}
          env:
            - name: RECENSE_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RECENSE_CLUSTER
              value: {{ .Values.clusterName | quote }}
            - name: RECENSE_ENVIRONMENT
              value: {{ .Values.environment | quote }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [DAC_READ_SEARCH]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: host
              mountPath: /host
              readOnly: true
            - name: runtime
              mountPath: /runtime/runtime.sock
              readOnly: true
            - name: cache
              mountPath: /var/lib/recense
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
        - name: runtime
          hostPath:
            path: {{ .Values.socketPath | quote }}
            type: Socket
        - name: cache
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
