image:
  repository: ghcr.io/opf/recense
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []
clusterName: ""
environment: ""
interval: 6h
scanTimeout: 15m
runtime: containerd
socketPath: /run/containerd/containerd.sock
containerdNamespace: k8s.io
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 2Gi
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - operator: Exists
