image:
  repository: ghcr.io/opf/recense
  tag: "0.2.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []
clusterName: ""
environment: ""
interval: 24h
jitter: 15m
scanTimeout: 45m
runtime: containerd
socketPath: /run/containerd/containerd.sock
resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 4Gi
  limits:
    cpu: 250m
    memory: 2Gi
    ephemeral-storage: 11Gi
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - operator: Exists
